name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.0"
      # The root project is virtual, so the workspace packages only install with --all-packages.
      - run: uv sync --locked --all-packages
      - run: uv run mypy
      - run: uv run pytest -m "not integration"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.0"
      - run: uv sync --locked --all-packages
      # The session fixture builds and starts the Compose stack, and tears it down afterwards.
      - run: uv run pytest -m integration
