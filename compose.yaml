x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://tasks:tasks@postgres:5432/tasks
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "tasks", "--dbname", "tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-alpine
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "--quiet", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: packages/common/Dockerfile
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      <<: *app-environment
      SHOTS: ${SHOTS:-1024}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app worker.app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 20s

  sweeper:
    build:
      context: .
      dockerfile: packages/sweeper/Dockerfile
    environment:
      <<: *app-environment
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-10}
      SWEEP_GRACE_SECONDS: ${SWEEP_GRACE_SECONDS:-30}
      STALE_TASK_SECONDS: ${STALE_TASK_SECONDS:-600}
      SWEEPER_HEALTHY_WITHIN_SECONDS: ${SWEEPER_HEALTHY_WITHIN_SECONDS:-60}
    deploy:
      replicas: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "sweeper.health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres-data:
  rabbitmq-data:
