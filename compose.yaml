x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://tasks:tasks@postgres:5432/tasks
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # Every service that declares the task queue must use the same cap (RabbitMQ refuses a
  # redeclaration with different arguments), so it is set once here.
  MAX_QUEUED_TASKS: ${MAX_QUEUED_TASKS:-10000}
  PUBLISH_TIMEOUT_SECONDS: ${PUBLISH_TIMEOUT_SECONDS:-5}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "tasks", "--dbname", "tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-alpine
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "--quiet", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: packages/common/Dockerfile
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      <<: *app-environment
      MAX_CIRCUIT_BYTES: ${MAX_CIRCUIT_BYTES:-65536}
      RETRY_AFTER_SECONDS: ${RETRY_AFTER_SECONDS:-5}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      <<: *app-environment
      SHOTS: ${SHOTS:-1024}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-60}
      AER_MAX_MEMORY_MB: ${AER_MAX_MEMORY_MB:-1700}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    # On SIGTERM, Celery's warm shutdown stops taking tasks and finishes the current one:
    # up to TASK_TIMEOUT_SECONDS, plus the runner's 5 s to stop a timed-out simulation,
    # plus a margin for recording the outcome. Docker kills it with SIGKILL after this.
    stop_grace_period: 75s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2"
          memory: 2G
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app worker.app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 20s

  sweeper:
    build:
      context: .
      dockerfile: packages/sweeper/Dockerfile
    environment:
      <<: *app-environment
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-10}
      SWEEP_GRACE_SECONDS: ${SWEEP_GRACE_SECONDS:-30}
      STALE_TASK_SECONDS: ${STALE_TASK_SECONDS:-600}
      SWEEPER_HEALTHY_WITHIN_SECONDS: ${SWEEPER_HEALTHY_WITHIN_SECONDS:-60}
    deploy:
      replicas: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "sweeper.health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres-data:
  rabbitmq-data:
