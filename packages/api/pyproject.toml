[project]
name = "api"
version = "0.1.0"
description = "HTTP API: accepts tasks and reports their outcomes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
