[project]
name = "sweeper"
version = "0.1.0"
description = "Publishes tasks that were stored but never published"
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "sqlalchemy[asyncio]>=2.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
