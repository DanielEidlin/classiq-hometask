[project]
name = "worker"
version = "0.1.0"
description = "Celery worker: parses and simulates circuits"
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "celery>=5.4",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "qiskit-qasm3-import==0.6.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
